# Caco-2 normalization comparison.
# Keep training hyperparameters close to config/config_finetune.yaml and only
# compare raw labels vs z-score standardized labels.
task: caco2
dataroot: ./data/mpp/pkl
splitroot: ./data/mpp/split
split_type: random_scaffold

result_dir: ./outputs/caco2_pipeline_norm_compare
gpus: "0"

fixed:
  # Matches config/config_finetune.yaml where possible.
  # Note: keep seed=8 to align with the existing caco2 random_scaffold split file.
  seed: 8
  batch_size: 16
  dropout: 0.1
  lr: 5.0e-5
  weight_decay: 1.0e-4
  epochs: 100
  patience: 10
  dist_bar: [30, 60]
  regression_label_transform: none

two_stage:
  # Stage 1 keeps the existing two-step warm-up default; Stage 2 follows
  # config/config_finetune.yaml epochs/patience/lr.
  stage1_epochs: 20
  stage1_patience: 10
  stage1_lr: 5.0e-5
  stage2_epochs: 100
  stage2_patience: 10
  stage2_lr: 5.0e-5

search:
  seed: [8]
  batch_size: [16]
  dropout: [0.1]
  weight_decay: [1.0e-4]
  scheduler_type: ["None"]
  regression_label_transform: ["none", "standardize"]
  stage1_lr: [5.0e-5]
  stage2_lr: [5.0e-5]
  stage1_epochs: [20]
  stage2_epochs: [100]
  stage1_patience: [10]
  stage2_patience: [10]
  dist_bar:
    - [30, 60]
