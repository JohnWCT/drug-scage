# Caco2 / logPapp 3-step finetune config
# Focus: dist_bar + transform + graph-prior search.
# Keep known good dist_bar anchors and test winsorized labels.
# Run:
# python 3_finetune_3step_mpp.py --search_config ./config/caco2_finetune_search_3step_distbar_90_100_with_anchors.yaml

task: caco2

dataroot: ./data/mpp/pkl
splitroot: ./data/mpp/split
split_type: random_scaffold
result_dir: ./outputs/caco2_pipeline_3step_winsorized_graph_prior
gpus: "0"

fixed:
  seed: 8
  batch_size: 32

  dropout: 0.2
  weight_decay: 1.0e-4
  scheduler_type: cos
  regression_label_transform: none
  winsorize_quantile_low: 0.01
  winsorize_quantile_high: 0.99

  optim_type: adam
  warm_up_epoch: 10
  start_lr: 1.0e-5
  init_base_lr: 1.0e-4

  # Keep SCAGE dynamic multi-task balancing for graph / finger / atom_fg.
  loss_weights: null
  stage2_loss_weights: null
  stage3_loss_weights: null

  # Stabilize Stage 3 full-model finetuning.
  encoder_lr_ratio: 0.03
  max_grad_norm: 0.5

  # Stable dynamic multi-task loss settings.
  eval_before_train: true
  mt_loss_eps: 1.0e-8
  mt_loss_tau: 5.0
  mt_ratio_clip: 2.0
  mt_loss_prior: null

  # Optional label-bin weighted regression loss (off by default).
  graph_label_reweight: false
  graph_label_bins: [-8.0, -7.0, -6.5, -6.0, -5.5, -5.0, -4.5, -4.0, -3.5]
  graph_label_weight_power: 0.5
  graph_label_weight_clip: 3.0

three_stage:
  stage1_lr: 5.0e-5
  stage2_lr: 5.0e-5
  stage3_lr: 1.0e-5

  stage1_epochs: 20
  stage2_epochs: 30
  stage3_epochs: 120

  stage1_patience: 10
  stage2_patience: 10
  stage3_patience: 30

  stage2_warmup_epochs: 10
  stage3_warmup_epochs: 10

search:
  regression_label_transform:
    - none
    - winsorized_standardize

  mt_loss_prior:
    - null
    - graph: 1.0
      finger: 0.3
      atom_fg: 0.1

  dist_bar:
    # Known good anchors retained
    - [20, 90]
    - [20, 100]
    - [50, 100]

    # Additional 10-step combinations with upper boundary fixed at 90
    - [10, 90]
    - [30, 90]
    - [40, 90]
    - [50, 90]
    - [60, 90]
    - [70, 90]
    - [80, 90]

    # Additional 10-step combinations with upper boundary fixed at 100
    - [10, 100]
    - [30, 100]
    - [40, 100]
    - [60, 100]
    - [70, 100]
    - [80, 100]
    - [90, 100]
